# Nginx Configuration Template for Next.js App Router Static Export Routing
# Place these rules inside your server {} configuration block.

location / {
    # Check if the query parameter contains _rsc (React Server Component request)
    if ($args ~* "(^|&)_rsc=") {
        rewrite ^/([^/]+)/?$ /$1/index.txt break;
        rewrite ^/([^/]+)/([^/]+)/?$ /$1/$2/index.txt break;
        rewrite ^/([^/]+)/([^/]+)/([^/]+)/?$ /$1/$2/$3/index.txt break;
    }

    # Standard clean URLs with trailingSlash: true configuration
    try_files $uri $uri/ $uri/index.html =404;
}
